name: dokandar_app_inventory
description: "BizDash – Flutter Business Admin UI Kit (UI only)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.20.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  flutter_slidable: ^3.0.1
  percent_indicator: ^4.2.5
  persistent_bottom_nav_bar: ^6.2.1
  fluttertoast: ^8.2.12
  permission_handler: ^12.0.0+1
  pdf: ^3.11.3
  syncfusion_flutter_pdfviewer: ^31.1.21
  printing: ^5.12.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.1
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  rename: ^3.0.2
  flutter_native_splash: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto-Italic-VariableFont_wdth,wght.ttf
          style: italic
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf

  assets:
    - assets/images/profile.jpg
    - assets/images/blank-profile-picture.png
    - assets/icon.png
    - assets/logo_only.png
    - assets/icon_bg_removed.png
    - assets/icon_bg_remove_with_name.png
